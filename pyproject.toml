[project]
name = "minichat"
version = "0.1.0"
description = "MiniChat - mesagerie locala cu istoric (Flask + Socket.IO + SQLite)"
readme = "README.md"
authors = [
    { name = "kommanderm", email = "matei5136@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-socketio>=5.7.0",
    "flask-sqlalchemy>=3.1.1",
]

# application, not a library: uv installs only the dependencies, nothing is built
[tool.uv]
package = false
